name: Prepare checksum-verified submission model
on:
  push:
    branches: [submission-cleanup-20261125]
    paths:
      - '.github/workflows/prepare-submission-model.yml'
permissions:
  contents: write
jobs:
  model:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: submission-cleanup-20261125
      - name: Retrieve exact licensed model
        run: |
          python3 - <<'PY'
          import hashlib, json, urllib.request
          from pathlib import Path
          root=Path("raspberry_pi/leaf_classifier")
          a=next(x for x in json.loads((root/"ASSETS.json").read_text()) if x["path"]=="model.onnx")
          assert a["sha256"] == "2fb0fd101fd9e744d95380e2a20d14d764b0b7da5d7b64ffdc06219d951ff18c"
          assert a["url"] == "https://huggingface.co/sarang-sketch/sarox-plangton/resolve/039a76b89e7caa1cf315b9637aaaa64bf238fbe5/model.onnx"
          with urllib.request.urlopen(a["url"], timeout=90) as response:
              data=response.read()
          assert hashlib.sha256(data).hexdigest() == a["sha256"]
          assert len(data) < 90_000_000
          (root/"model.onnx").write_bytes(data)
          print("SHA-256 verified:", a["sha256"], "bytes:", len(data))
          PY
      - name: Store model in submission branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f raspberry_pi/leaf_classifier/model.onnx
          git commit -m "Include checksum-verified licensed ONNX classifier"
          git push origin HEAD:refs/heads/submission-cleanup-20261125
